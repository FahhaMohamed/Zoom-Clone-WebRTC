# ============================================================
# SECRET SCANNING WORKFLOW
# ============================================================
# Purpose: Find accidentally committed secrets (API keys, passwords, tokens)
# Tool: GitLeaks — scans your code and git history for exposed credentials
#
# WHY a separate workflow (not inside frontend-ci.yml)?
#   - Secrets can be ANYWHERE (frontend, backend, config, scripts, README)
#   - This scans the ENTIRE repo, not just client/
#   - Different purpose: security vs code quality
# ============================================================
name: Security — Secret Scan

# ============================================================
# TRIGGER — Run on ALL pushes and PRs (no path filter!)
# ============================================================
# No "paths:" filter here because secrets can be in ANY file:
#   - .env files
#   - config.js
#   - README.md (people paste keys in examples!)
#   - server/ files
#   - client/ files
#   - scripts/
on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

# ============================================================
# JOBS
# ============================================================
jobs:
  # -------------------------------------------
  # JOB: Scan for leaked secrets
  # -------------------------------------------
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code WITH full git history
      # "fetch-depth: 0" means get ALL commits, not just the latest
      # Why? A secret might have been committed 10 commits ago
      # and then "deleted" — but it's still in git history!
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: Install GitLeaks
      # We install it manually instead of using the action
      # so we can control exactly HOW it scans (full repo vs just new changes)
      - name: Install GitLeaks
        run: |
          wget -qO- https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz
          chmod +x gitleaks

      # STEP 3: Scan ENTIRE git history
      # This catches secrets committed at ANY point — even months ago
      # Even if the secret was "deleted" in a later commit, it's still
      # in git history and attackers can find it
      #
      # --source .     → scan this repo
      # --verbose      → show details of what was found
      # --redact       → hide the actual secret value in logs (safety!)
      - name: Scan full git history
        run: ./gitleaks detect --source . --verbose --redact
