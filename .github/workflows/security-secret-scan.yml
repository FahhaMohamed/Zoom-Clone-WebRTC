# ============================================================
# SECRET SCANNING WORKFLOW
# ============================================================
# Purpose: Find accidentally committed secrets (API keys, passwords, tokens)
# Tool: GitLeaks — scans your code and git history for exposed credentials
#
# WHY a separate workflow (not inside frontend-ci.yml)?
#   - Secrets can be ANYWHERE (frontend, backend, config, scripts, README)
#   - This scans the ENTIRE repo, not just client/
#   - Different purpose: security vs code quality
# ============================================================
name: Security — Secret Scan

# ============================================================
# TRIGGER — Run on ALL pushes and PRs (no path filter!)
# ============================================================
# No "paths:" filter here because secrets can be in ANY file:
#   - .env files
#   - config.js
#   - README.md (people paste keys in examples!)
#   - server/ files
#   - client/ files
#   - scripts/
on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

# ============================================================
# JOBS
# ============================================================
jobs:
  # -------------------------------------------
  # JOB: Scan for leaked secrets
  # -------------------------------------------
  secret-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Checkout code WITH full git history
      # "fetch-depth: 0" means get ALL commits, not just the latest
      # Why? A secret might have been committed 10 commits ago
      # and then "deleted" — but it's still in git history!
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # STEP 2: Run GitLeaks
      # GitLeaks scans every file and every commit for patterns like:
      #   - API keys (AWS, Google, Firebase, Stripe, etc.)
      #   - Passwords and connection strings
      #   - Private keys and certificates
      #   - Tokens (GitHub, Slack, Discord, etc.)
      #
      # If it finds ANY secret → the job FAILS → PR is blocked
      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN is automatically provided by GitHub
          # You don't need to create this secret — it already exists!
