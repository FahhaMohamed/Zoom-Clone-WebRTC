# ============================================================
# WORKFLOW NAME
# ============================================================
# This is just a label — it shows up in the GitHub Actions tab
name: Frontend CI

# ============================================================
# TRIGGER — "When should this workflow run?"
# ============================================================
on:
  # Run when code is PUSHED to these branches
  push:
    branches:
      - main
      - dev
    # ONLY run when files inside client/ folder change
    # OR when the workflow file itself changes
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"

  # Also run when a Pull Request targets these branches
  # NO paths filter on PRs — run ALL checks before merging
  # (paths filter only on push to save resources on direct pushes)
  pull_request:
    branches:
      - main
      - dev

# ============================================================
# JOBS — "What should happen?"
# ============================================================
jobs:
  # -------------------------------------------
  # JOB 1: Build the frontend
  # -------------------------------------------
  build:
    # The name that shows in GitHub UI
    name: Build Frontend

    # Which machine to run on (GitHub gives you free Linux VMs)
    runs-on: ubuntu-latest

    # -------------------------------------------
    # STEPS — "Do these things in order"
    # -------------------------------------------
    steps:
      # STEP 1: Checkout the code
      # Without this, the runner has an empty machine — no code!
      # Think of it as: git clone your-repo
      - name: Checkout code
        uses: actions/checkout@v4

      # STEP 2: Set up Node.js
      # The runner doesn't have Node by default, so we install it
      # We pick version 20 (LTS = Long Term Support = stable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # STEP 3: Install dependencies
      # Same as running "npm install" on your own machine
      # "working-directory" tells it to run INSIDE the client/ folder
      - name: Install dependencies
        working-directory: client
        run: npm install

      # STEP 4: Build the project
      # This runs "react-scripts build" which compiles your React app
      # If there are any errors (import issues, syntax errors), it FAILS here
      - name: Build
        working-directory: client
        run: npx react-scripts build

  # -------------------------------------------
  # JOB 2: Lint the frontend (runs in PARALLEL with build)
  # -------------------------------------------
  # No "needs:" here, so it starts at the SAME TIME as build
  # Think: build checks "can the app compile?"
  #        lint  checks "is the code clean?"
  lint:
    name: Lint Frontend

    runs-on: ubuntu-latest

    steps:
      # Same first 3 steps — every job runs on a FRESH machine
      # so each job needs to checkout code and install dependencies again
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: client
        run: npm install

      # STEP 4: Run the linter
      # npx eslint src/ → scans every file inside client/src/
      # --max-warnings 0 → even warnings cause a FAIL (strict mode)
      #   Remove --max-warnings 0 if you want warnings to pass
      - name: Lint
        working-directory: client
        run: npx eslint src/

  # -------------------------------------------
  # JOB 3: Gate check (runs AFTER build and lint pass)
  # -------------------------------------------
  # This is a SEQUENTIAL job — it uses "needs" to wait
  # Common pattern: a final gate that only passes if everything else passed
  # Useful for branch protection rules (you set ONE required check instead of many)
  all-checks:
    name: All Checks Passed

    # "needs" = "don't start until these jobs finish successfully"
    # If build OR lint fails → this job is SKIPPED → shows ❌ on the PR
    needs: [build, lint]

    runs-on: ubuntu-latest

    steps:
      # This job doesn't need to do real work
      # It exists just to be a single "gateway" status check
      # If it runs, it means everything above passed ✅
      - name: All checks passed
        run: echo "Build and Lint passed! Ready to merge."
